<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Twitchy Overlay</title>
  <link rel="stylesheet" href="/overlay/style.css">
</head>
<body>
  <main id="stage" aria-label="Twitchy stream overlay">
    <div id="cover" aria-hidden="true">
      <span class="cover-corner top-left"></span><span class="cover-corner top-right"></span>
      <span class="cover-corner bottom-left"></span><span class="cover-corner bottom-right"></span>
      <span class="cover-label">BLOCKED!</span>
      <span class="cover-spark spark-one">✦</span><span class="cover-spark spark-two">✦</span>
    </div>
    <div id="twitchy" data-state="off" aria-hidden="true">
      <span class="aura"></span>
      <span class="zzz">Z<span>Z</span>Z</span>
      <span class="alarm">!</span>
      <svg id="mascot" viewBox="0 0 32 32" role="presentation" aria-hidden="true" shape-rendering="crispEdges"><use id="mascot-pose" href="/overlay/assets/twitchy.svg#off"></use></svg>
      <span class="dust dust-one"></span><span class="dust dust-two"></span>
    </div>
    <div id="counter" aria-live="polite" aria-atomic="true">
      <svg class="counter-shield" viewBox="0 0 16 18" aria-hidden="true" shape-rendering="crispEdges"><path d="M2 1h12v3h2v8h-2v2h-3v2H5v-2H2v-2H0V4h2z" fill="currentColor"/><path d="M5 5h2v3h2V5h2v5H9v2H7v-2H5z" fill="#17172c"/></svg>
      <span id="count">0</span>
      <span class="counter-copy">leaks blocked this stream</span>
    </div>
  </main>
  <script type="module" src="/overlay/overlay.js"></script>
</body>
</html>
