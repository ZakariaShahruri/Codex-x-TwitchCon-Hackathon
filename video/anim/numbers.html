<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Numbers</title>
<!-- Leak Gauntlet result (seed 3, real run): counts up. Rendered by video/build/capture.mjs. -->
<style>
  @font-face { font-family: Pixelify; src: url("../../web/dashboard/fonts/PixelifySans-latin-wght.woff2"); font-weight: 400 700; }
  @font-face { font-family: Inter; src: url("../../web/dashboard/fonts/Inter-latin-wght.woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1f1f23; color: #efeff1; font-family: Inter, sans-serif; }
  .wrap { position: absolute; inset: 0 0 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; }
  h1 { font-family: Pixelify; font-size: 66px; color: #ffcf5c; }
  .row { display: flex; gap: 34px; }
  .stat { width: 430px; padding: 34px 40px; border-radius: 24px; background: #2b2b31; border: 2px solid #3d3d44; opacity: var(--o); transform: translateY(var(--y)) scale(var(--s)); }
  .stat b { display: block; font-family: Pixelify; font-size: 120px; line-height: 1; }
  .stat span { display: block; font-size: 32px; color: #b8b8c2; margin-top: 12px; }
  .mint { color: #5fe3b5; }
  .bar { width: 1200px; opacity: var(--o); }
  .bar .lbl { display: flex; justify-content: space-between; font-size: 32px; color: #b8b8c2; margin-bottom: 14px; }
  .bar .lbl b { color: #efeff1; }
  .track { position: relative; height: 34px; border-radius: 17px; background: #2b2b31; border: 2px solid #3d3d44; overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #5fe3b5, #9146ff); border-radius: 17px; }
  .ok { font-size: 40px; font-weight: 800; color: #5fe3b5; opacity: var(--o); transform: scale(var(--s)); }
</style>
</head>
<body>
<div class="wrap">
  <h1>LEAK GAUNTLET · seed 3</h1>
  <div class="row">
    <div class="stat" id="s1"><b class="mint" id="n1">0/37</b><span>fake secrets blocked</span></div>
    <div class="stat" id="s2"><b id="n2">0</b><span>false alarms on 14 lookalikes</span></div>
    <div class="stat" id="s3"><b class="mint" id="n3">0/3</b><span>quick flashes blocked</span></div>
  </div>
  <div class="bar" id="bar"><div class="lbl"><span>p95 from screen to mask: <b id="ms">0 ms</b></span><span>stream delay: <b>1000 ms</b></span></div>
    <div class="track"><div class="fill" id="fill"></div></div></div>
  <div class="ok" id="ok">✓ every mask up before air</div>
</div>
<script>
const clamp = (x) => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = (id) => document.getElementById(id);
const pop = (id, at) => { const k = span(window.T, at, at + .35); const el = $(id); el.style.setProperty("--o", k); el.style.setProperty("--y", `${(1 - easeOut(k)) * 40}px`); el.style.setProperty("--s", back(k)); };
window.DURATION = 5.8;
window.render = (t) => {
  window.T = t;
  pop("s1", .1); pop("s2", .45); pop("s3", .8);
  $("n1").textContent = `${Math.round(37 * span(t, .3, 1.9))}/37`;
  $("n3").textContent = `${Math.round(3 * span(t, 1.0, 1.9))}/3`;
  $("bar").style.setProperty("--o", span(t, 2.0, 2.3));
  const k = easeOut(span(t, 2.2, 3.4));
  $("fill").style.width = `${31.1 * k}%`;
  $("ms").textContent = `${Math.round(311 * k)} ms`;
  const ok = span(t, 3.5, 3.85); $("ok").style.setProperty("--o", ok); $("ok").style.setProperty("--s", back(ok));
};
document.fonts.ready.then(() => { window.READY = true; });
</script>
</body>
</html>
