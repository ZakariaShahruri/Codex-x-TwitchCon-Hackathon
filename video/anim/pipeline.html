<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipeline</title>
<!-- How Twitchy works: the boxes build up and a frame travels through them. Rendered by video/build/capture.mjs. -->
<style>
  @font-face { font-family: Pixelify; src: url("../../web/dashboard/fonts/PixelifySans-latin-wght.woff2"); font-weight: 400 700; }
  @font-face { font-family: Inter; src: url("../../web/dashboard/fonts/Inter-latin-wght.woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1f1f23; color: #efeff1; font-family: Inter, sans-serif; }
  h1 { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font-size: 58px; font-weight: 750; }
  .box { position: absolute; width: 300px; height: 150px; padding: 24px 22px; border-radius: 20px; background: #2b2b31; border: 3px solid var(--c, #3d3d44);
    opacity: var(--o, 0); transform: translateY(var(--y, 0px)) scale(var(--s, 1)); box-shadow: 0 0 var(--g, 0px) var(--c, #000); }
  .box b { display: block; font-size: 34px; } .box span { display: block; font-size: 24px; color: #b8b8c2; margin-top: 10px; }
  .arrow { position: absolute; height: 6px; background: #9146ff; border-radius: 3px; transform-origin: 0 50%; }
  .packet { position: absolute; width: 96px; height: 66px; border-radius: 10px; background: #15171d; border: 3px solid #ffcf5c; box-shadow: 0 8px 22px #000a; }
  .packet i { position: absolute; left: 10px; right: 10px; height: 8px; border-radius: 3px; background: #4a4f5c; }
  .packet i.k { background: #f2c27b; }
  .foot { position: absolute; bottom: 210px; left: 0; right: 0; text-align: center; font-size: 34px; color: #b8b8c2; }
</style>
</head>
<body>
<h1 id="title">How Twitchy works</h1>
<div id="stage"></div>
<div class="packet" id="packet"><i style="top:12px"></i><i class="k" id="pk" style="top:28px"></i><i style="top:44px;right:36px"></i></div>
<div class="foot" id="foot">No frame leaves your Mac · no AI on the live path · $0 to run</div>
<script>
const clamp = (x) => Math.min(1, Math.max(0, x));
const span = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// Two rows: capture → read → detect → mask, then delay → Twitch.
const BOXES = [
  ["OBS frame", "undelayed, every 150 ms", "#3d3d44", 150, 330, .3],
  ["Apple Vision", "on-device text + QR reading", "#3d3d44", 560, 330, 1.2],
  ["Detectors", "keys · Luhn · BIP39 · watchlist · your rules", "#3d3d44", 970, 330, 2.1],
  ["Mask", "placed in OBS", "#5fe3b5", 1380, 330, 3.0],
  ["1 s stream delay", "masks land inside it", "#ffcf5c", 1380, 590, 4.0],
  ["Twitch", "viewers never see it", "#9146ff", 970, 590, 4.9],
];
const stage = document.getElementById("stage");
const boxes = BOXES.map(([title, sub, color, x, y]) => {
  const el = document.createElement("div"); el.className = "box"; el.style.left = `${x}px`; el.style.top = `${y}px`; el.style.setProperty("--c", color);
  el.innerHTML = `<b>${title}</b><span>${sub}</span>`; stage.appendChild(el); return el;
});
const ARROWS = [[450, 405, 110, 0, 1.0], [860, 405, 110, 0, 1.9], [1270, 405, 110, 0, 2.8], [1533, 480, 110, Math.PI / 2, 3.8], [1380, 668, 110, Math.PI, 4.7]];
const arrows = ARROWS.map(([x, y, len, rot]) => { const a = document.createElement("div"); a.className = "arrow"; a.style.left = `${x}px`; a.style.top = `${y}px`; a.style.width = `${len}px`; a.style.transform = `rotate(${rot}rad) scaleX(0)`; stage.appendChild(a); return a; });
// The packet's route: box centres in order (down from Mask to the delay, then left to Twitch).
const ROUTE = [[300, 405], [710, 405], [1120, 405], [1530, 405], [1530, 665], [1120, 665]];
window.DURATION = 12.8;
window.render = (t) => {
  BOXES.forEach(([, , , , , at], i) => { const k = span(t, at, at + .4); const el = boxes[i]; el.style.setProperty("--o", k); el.style.setProperty("--y", `${(1 - easeOut(k)) * 30}px`); el.style.setProperty("--s", back(k)); });
  ARROWS.forEach(([x, y, len, rot, at], i) => { arrows[i].style.transform = `rotate(${rot}rad) scaleX(${easeOut(span(t, at, at + .35))})`; });
  // packet travels the route after everything is built, pausing at each box; the box it is in glows
  const legT = (t - 6.0) / 1.0; const leg = Math.floor(legT); const k = easeInOut(legT - leg);
  const p = document.getElementById("packet");
  if (t < 5.8) p.style.opacity = 0;
  else {
    p.style.opacity = span(t, 5.8, 6.0);
    const a = ROUTE[Math.max(0, Math.min(leg, ROUTE.length - 1))], b = ROUTE[Math.max(0, Math.min(leg + 1, ROUTE.length - 1))];
    p.style.left = `${a[0] + (b[0] - a[0]) * k - 48}px`; p.style.top = `${a[1] + (b[1] - a[1]) * k - 125}px`;
    const at = Math.max(0, Math.min(Math.round(legT), ROUTE.length - 1));
    boxes.forEach((el, i) => el.style.setProperty("--g", i === at ? "34px" : "0px"));
    document.getElementById("pk").style.background = legT >= 3 ? "#000" : "#f2c27b";
    document.getElementById("pk").style.boxShadow = legT >= 3 ? "0 0 0 2px #5fe3b5" : "none";
    p.style.borderColor = legT >= 4.6 ? "#9146ff" : legT >= 3 ? "#5fe3b5" : "#ffcf5c";
  }
  document.getElementById("foot").style.opacity = span(t, 11.0, 11.5);
  document.getElementById("title").style.opacity = span(t, 0, .4);
};
document.fonts.ready.then(() => { window.READY = true; });
</script>
</body>
</html>
